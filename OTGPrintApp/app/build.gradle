plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.otgprint.app'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId "com.otgprint.app"
        minSdk 26          // Android 8.0+: adaptive icon / RECEIVER_NOT_EXPORTED 全覆盖
        targetSdk 34
        versionCode 4
        versionName "1.3"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    // 签名密钥不入库: keystore 存在才用正式签名, 否则 release 退回 debug 签名。
    // 自行构建请生成自己的 keystore (见 README), 密码也可用环境变量注入。
    def ksFile = rootProject.file('otgprint.keystore')
    if (ksFile.exists()) {
        signingConfigs {
            otgRelease {
                storeFile ksFile
                storePassword System.getenv('OTG_KS_PASS') ?: 'otgprint123'
                keyAlias 'otgprint'
                keyPassword System.getenv('OTG_KS_PASS') ?: 'otgprint123'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksFile.exists()) {
                signingConfig signingConfigs.otgRelease
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
